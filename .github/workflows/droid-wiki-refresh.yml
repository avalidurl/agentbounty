name: Droid Wiki Refresh

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wiki-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Factory Droid
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Generate wiki (Factory)
        run: droid exec --auto high "/wiki"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}

      - name: Mirror wiki to GitHub
        if: ${{ hashFiles('droid-wiki/**') != '' }}
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "factory-droid[bot]"
          git config --global user.email "contact@gokhan.vc"
          git config --global "url.https://x-access-token:${GH_TOKEN}@github.com/.insteadOf" "https://github.com/"
          droid wiki-upload \
            --repo-url https://github.com/${{ github.repository }} \
            --wiki-dir ./droid-wiki \
            --upload-to github 2>&1 | tee /tmp/wiki-upload.log
          if grep -q "GitHub wiki sync failed" /tmp/wiki-upload.log; then
            echo "::error::GitHub wiki sync reported failure"
            exit 1
          fi
